name: 할 일
description: 노션 캘린더의 업무를 쪼갠 작업 하나
labels: ["할 일"]
body:
  - type: dropdown
    id: part
    attributes:
      label: 파트
      options: [Frontend, Backend, Data, PM, 전체]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: 무엇을
      placeholder: 예) sec_get 에 3회 재시도 넣기
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: 예) 404면 None, 500이면 3번 시도 후 None — 테스트 2개 통과
  - type: input
    id: due
    attributes:
      label: 마감
      placeholder: 예) 11/16
